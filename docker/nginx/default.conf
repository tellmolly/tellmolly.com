# PRODUCTION nginx vhost (baked into tellmolly-com-web:latest).
# The local development equivalent is .docker/nginx/default.conf; the differences
# are deliberate: fastcgi_pass targets the production compose service name
# ('tellmolly-com', not the dev service 'app') and logs go to stdout/stderr.
server {
    listen 80;
    index index.php index.html;

    # Behind the Cloudflare tunnel; the app enforces its canonical URL via APP_URL
    # (https://www.tellmolly.com).
    server_name _;
    server_tokens off;

    error_log  /dev/stderr warn;
    access_log /dev/stdout;

    root /app/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 16M;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # php-fpm container (compose service 'tellmolly-com'), NOT the dev name 'app'.
        fastcgi_pass tellmolly-com:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
